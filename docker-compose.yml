services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SCHEMADASH_POSTGRES_DB:-schemadash}
      POSTGRES_USER: ${SCHEMADASH_POSTGRES_USER:-schemadash}
      POSTGRES_PASSWORD: ${SCHEMADASH_POSTGRES_PASSWORD:?set SCHEMADASH_POSTGRES_PASSWORD in .env}
    ports:
      - '${SCHEMADASH_POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${SCHEMADASH_POSTGRES_USER:-schemadash} -d ${SCHEMADASH_POSTGRES_DB:-schemadash}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SCHEMADASH_API_PORT: 4010
      SCHEMADASH_API_HOST: 0.0.0.0
      SCHEMADASH_SECRET_KEY: ${SCHEMADASH_SECRET_KEY:?set SCHEMADASH_SECRET_KEY in .env}
      SCHEMADASH_DATA_DIR: /app/data
      SCHEMADASH_CORS_ORIGIN: ${SCHEMADASH_CORS_ORIGIN:-http://localhost:8080}
      SCHEMADASH_LOG_LEVEL: ${SCHEMADASH_LOG_LEVEL:-info}
      SCHEMADASH_TRUST_PROXY: ${SCHEMADASH_TRUST_PROXY:-false}
      SCHEMADASH_AUTH_MODE: ${SCHEMADASH_AUTH_MODE:-disabled}
      SCHEMADASH_AUTH_EMAIL: ${SCHEMADASH_AUTH_EMAIL:-}
      SCHEMADASH_AUTH_PASSWORD: ${SCHEMADASH_AUTH_PASSWORD:-}
      SCHEMADASH_AUTH_DISPLAY_NAME: ${SCHEMADASH_AUTH_DISPLAY_NAME:-SchemaDash Owner}
      SCHEMADASH_BOOTSTRAP_SETUP_CODE: ${SCHEMADASH_BOOTSTRAP_SETUP_CODE:-}
      SCHEMADASH_BOOTSTRAP_ADMIN_EMAIL: ${SCHEMADASH_BOOTSTRAP_ADMIN_EMAIL:-}
      SCHEMADASH_SESSION_COOKIE_SECURE: ${SCHEMADASH_SESSION_COOKIE_SECURE:-}
      SCHEMADASH_OIDC_ISSUER: ${SCHEMADASH_OIDC_ISSUER:-}
      SCHEMADASH_OIDC_CLIENT_ID: ${SCHEMADASH_OIDC_CLIENT_ID:-}
      SCHEMADASH_OIDC_CLIENT_SECRET: ${SCHEMADASH_OIDC_CLIENT_SECRET:-}
      SCHEMADASH_OIDC_REDIRECT_URL: ${SCHEMADASH_OIDC_REDIRECT_URL:-}
      SCHEMADASH_OIDC_LOGOUT_URL: ${SCHEMADASH_OIDC_LOGOUT_URL:-}
      SCHEMADASH_OIDC_SCOPES: ${SCHEMADASH_OIDC_SCOPES:-openid profile email}
      SCHEMADASH_DEFAULT_PROJECT_NAME: ${SCHEMADASH_DEFAULT_PROJECT_NAME:-My Diagrams}
      SCHEMADASH_DEFAULT_OWNER_NAME: ${SCHEMADASH_DEFAULT_OWNER_NAME:-Local Owner}
    ports:
      - '${SCHEMADASH_API_PORT:-4010}:4010'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - schemadash-api-data:/app/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(`http://127.0.0.1:4010/api/readyz`).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-api:4010}
      API_BASE_URL: ${VITE_API_BASE_URL:-}
      OPENAI_API_KEY: ${VITE_OPENAI_API_KEY:-}
      OPENAI_API_ENDPOINT: ${VITE_OPENAI_API_ENDPOINT:-}
      LLM_MODEL_NAME: ${VITE_LLM_MODEL_NAME:-}
      HIDE_SCHEMADASH_CLOUD: ${VITE_HIDE_SCHEMADASH_CLOUD:-true}
      DISABLE_ANALYTICS: ${VITE_DISABLE_ANALYTICS:-true}
    ports:
      - '${SCHEMADASH_WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://127.0.0.1/healthz',
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  schemadash-api-data:
